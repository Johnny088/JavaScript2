<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container col-3 offset-3 my-5">
      <div class="p-5">
        <h2>create a new color</h2>
        <form class="form mx-auto" id="submit">
          <label for="color">Color:</label>
          <input type="text" required id="color" />
          <div id="nameError" class="error"></div>
          <label for="type">Type:</label>
          <select required id="type" name="type">
            <option value="RGB">RGB</option>
            <option value="RGBA">RGBA</option>
            <option value="HEX">HEX</option>
          </select>
          <div id="typeError" class="error"></div>
          <label>Code:</label><input type="text" required id="code" />
          <div id="codeError" class="error"></div>
          <p class="spotlight" id="spotlight">rbg (1-255,1-255,1-255)</p>
          <button class="mt-3" id="save_btn">save</button>
        </form>
      </div>
    </div>
    <h2 class="text-center">All collors</h2>
    <div class="color__container container" id="box__color"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
