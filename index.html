<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forecast</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="container form">
          <div id="city">city</div>
          <form class="form__input">
            <input type="text" placeholder="city" />
            <img src="./images/search.svg" alt="" class="subBtn" id="subBtn" />
          </form>
        </div>
      </header>
      <section>
        <div class="container" id="errorCase">
          <nav class="nav__menu" id="nav__menu">
            <button class="nav__btn" id="today__btn">Today</button>
            <button class="nav__btn" id="five__day__btn">5-day forecast</button>
          </nav>
          <div class="weather__title">
            <h2>Current weather</h2>
            <p class="data" id="data">data</p>
          </div>

          <div class="weather__hero">
            <ul class="current__weather">
              <li id="current_icon"></li>
              <li id="state"></li>
            </ul>
            <ul class="weather__degrees">
              <li id="degree" class="degree"></li>
              <li class="degree__like" id="degree__like"></li>
            </ul>
            <ul class="weather__time" id="weather__time">
              <li class="sunrise" id="sunrise"></li>
              <li class="sunset" id="sunset"></li>
              <li class="duration" id="duration">duration</li>
            </ul>
          </div>
        </div>
      </section>
      <section>
        <div class="container">
          <h2 class="hourly">Hourly</h2>
          <ul class="weather__hourly" id="weather__hourly"></ul>
        </div>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
