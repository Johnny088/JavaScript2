<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="container">
      <h2>All users</h2>
      <div class="grid" id="grid"></div>
    </section>
    <section class="container">
      <h2>User info:</h2>
      <table>
        <tbody>
          <tr>
            <td>Name:</td>
            <td id="name"></td>
          </tr>
          <tr>
            <td>Username:</td>
            <td id="userName"></td>
          </tr>
          <tr>
            <td>Address:</td>
            <td id="address"></td>
          </tr>
          <tr>
            <td>Email:</td>
            <td id="email"></td>
          </tr>
          <tr>
            <td>Phone:</td>
            <td id="phone"></td>
          </tr>
          <tr>
            <td>Website</td>
            <td id="website"></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2"><button id="showPosts">Show post</button></td>
          </tr>
        </tfoot>
      </table>
    </section>
    <section>
      <h2>posts</h2>
      <ul id="postBox"></ul>
    </section>

    <script src="./mailn.js"></script>
  </body>
</html>
