<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="icon" href="data:," />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <form
      class="container d-flex mt-5 justify-content-center flex-column form p-5 pt-3 gap-1"
    >
      <div id="wrapMessages">
        <!-- <div class="d-flex justify-content-between">
          <p id="currentName">name</p>
          <p id="currentDate">date</p>
        </div>
        <div id="messages w-100"></div> -->
      </div>
      <label
        >Your name: <input type="text" class="w-75 ms-4" id="name"
      /></label>
      <label
        >Your email:
        <textarea
          name="feedback"
          class="feedback w-75 ms-4"
          id="feedback"
        ></textarea>
      </label>
      <button class="p-2" onclick="addMessage()" type="button">send</button>
    </form>
    <form
      class="container d-flex my-5 justify-content-center form p-5 pt-3 gap-1 justify-content-center flex-column"
      id="submitForm"
    >
      <div class="text-center d-flex">
        <label>Your email:<input type="email" required /> </label>

        <label>Your login: <input type="login" required /></label>
      </div>
      <div class="text-center d-flex">
        <label
          >Your password:
          <input type="password" required name="password" id="password"
        /></label>
        <label
          >Repeat password:
          <input
            type="password"
            required
            name="checkPassword"
            id="checkPassword"
        /></label>
      </div>
      <button class="mt-5" onsubmit="">sign Up</button>
    </form>
    <div class="container mt-5">
      <form class="text-center position-relative" id="form__colors">
        <label
          >R
          <input type="number" min="1" max="255" name="red" id="red" required
        /></label>
        <label
          >G
          <input
            type="number"
            min="1"
            max="255"
            name="green"
            id="green"
            required
        /></label>
        <label
          >B
          <input type="number" min="1" max="255" name="blue" id="blue" required
        /></label>
        <button class="position-absolute btn__color">Add color</button>
      </form>
      <div id="colors_container d-flex flex-wrap justify-content-center"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="./main.js" defer></script>
  </body>
</html>
