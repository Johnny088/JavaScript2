<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage</title>
    <link rel="icon" href="data:," />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="d-flex justify-content-center row">
      <form class="container mt-5 form col-4" id="submit">
        <div class="row">
          <div class="col-6 mb-3">
            <label for="firstname" class="form-label">First name</label>
            <input
              type="text"
              id="firstname"
              class="form-control"
              name="firstname"
            />
          </div>
          <div class="col-6 mb-3">
            <label for="lastname" class="form-label">Last name</label>
            <input
              type="text"
              id="lastname"
              class="form-control"
              name="lastname"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label for="birthday" class="form-label">Birthday</label>
            <input
              type="date"
              id="birthday"
              class="form-control"
              name="birthday"
            />
          </div>
          <div class="col-6 mt-4 mb-3">
            <label class="form-label">Gender:</label>
            <label class="form-label">
              Male:
              <input
                type="radio"
                name="gender"
                id="male"
                checked
                value="male"
              />
            </label>
            <label class="form-label"
              >Female:
              <input type="radio" name="gender" id="female" value="female" />
            </label>
          </div>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label for="country" class="form-label">Country</label>
            <input
              type="text"
              id="country"
              class="form-control"
              name="country"
            />
          </div>
          <div class="col-6 mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" id="city" class="form-control" name="city" />
          </div>
        </div>

        <span class="form-label me-2">Skills:</span>

        <div class="form-check form-check-inline">
          <label>
            <input
              class="form-check-input"
              type="checkbox"
              name="skills"
              value="html"
            />
            HTML
          </label>
        </div>

        <div class="form-check form-check-inline">
          <label>
            <input
              class="form-check-input"
              type="checkbox"
              name="skills"
              value="css"
            />
            CSS
          </label>
        </div>

        <div class="form-check form-check-inline">
          <label>
            <input
              class="form-check-input"
              type="checkbox"
              name="skills"
              value="js"
            />
            JS
          </label>
        </div>

        <div class="form-check form-check-inline">
          <label>
            <input
              class="form-check-input"
              type="checkbox"
              name="skills"
              value="php"
            />
            PHP
          </label>
        </div>
        <div class="form-check form-check-inline">
          <label>
            <input
              class="form-check-input"
              type="checkbox"
              name="skills"
              value="c++"
            />
            C++
          </label>
        </div>
        <button class="w-100 mt-2">save</button>
      </form>
    </section>
    <section class="d-flex justify-content-center row mt-3">
      <div class="col-4 form">
        <table>
          <thead>
            <tr>
              <th>Result</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Firstname</td>
              <td id="getFirstname"></td>
            </tr>
            <tr>
              <td>Lastname</td>
              <td id="getLastname"></td>
            </tr>
            <tr>
              <td>Birthday</td>
              <td id="GetBirthday"></td>
            </tr>
            <tr>
              <td>Gender</td>
              <td id="GetGender"></td>
            </tr>
            <tr>
              <th>Country</th>
              <td id="GetCountry"></td>
            </tr>
            <tr>
              <th>City</th>
              <td id="getCity"></td>
            </tr>
            <tr>
              <td>Skills</td>
              <td id="getSkills"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
